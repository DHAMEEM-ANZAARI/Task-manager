<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== AUTH PAGE ===== -->
<div id="authPage" class="page active">
  <div class="box">
    <h2>Register</h2>
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPassword" placeholder="Password">
    <button class="auth-btn" onclick="register()">Register</button>
    <div id="regMsg" class="msg"></div>
  </div>

  <div class="box">
    <h2>Login</h2>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button class="auth-btn" onclick="login()">Login</button>
    <div id="loginMsg" class="msg"></div>
    <button class="link-btn" onclick="showPage('forgotPage')">Forgot Password?</button>
  </div>
</div>

<!-- ===== FORGOT PASSWORD PAGE ===== -->
<div id="forgotPage" class="page">
  <div class="box">
    <h2>Reset Password</h2>
    <input type="email" id="forgotEmail" placeholder="Registered Email">
    <input type="password" id="newPassword" placeholder="New Password">
    <input type="password" id="confirmPassword" placeholder="Confirm New Password">
    <button class="auth-btn" onclick="resetPassword()">Reset Password</button>
    <div id="forgotMsg" class="msg"></div>
    <button class="link-btn" onclick="showPage('authPage')">&#8592; Back to Login</button>
  </div>
</div>

<!-- ===== DASHBOARD PAGE ===== -->
<div id="dashboardPage" class="page">
  <div class="dashboard-box">
    <h2>Task Manager</h2>
    <p id="welcomeMsg"></p>

    <div class="task-form">
      <input type="text" id="taskInput" placeholder="Enter task">

      <div class="task-meta">
        <div class="meta-group">
          <label for="taskDueDate">Due Date</label>
          <input type="date" id="taskDueDate">
        </div>
      </div>

      <div class="form-buttons">
        <button class="add-btn" onclick="addTask()">➕ Add Task</button>
        <button class="view-btn" onclick="openTasksPage()">📋 View Tasks</button>
      </div>
    </div>

    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</div>

<!-- ===== TASKS PAGE ===== -->
<div id="tasksPage" class="page">
  <div class="tasks-page-box">

    <div class="tasks-page-header">
      <button class="back-btn" onclick="showPage('dashboardPage')">&#8592; Back</button>
      <h2>My Tasks</h2>
      <span id="taskCount" class="task-count-badge"></span>
    </div>

    <div class="filter-bar">
      <select id="filterStatus" onchange="displayTasks()">
        <option value="all">All Tasks</option>
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
      </select>
      <select id="sortBy" onchange="displayTasks()">
        <option value="newest">Newest First</option>
        <option value="duedate">By Due Date</option>
        <option value="priority">By Priority</option>
      </select>
    </div>

    <ul id="taskList"></ul>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
